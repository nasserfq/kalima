name: Release

# A push to `release` builds كلمة for macOS, Windows and Linux and publishes the downloads as a
# GitHub release, which installed copies offer as an update (update and restart).
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # Release n is version 1.<n>.0: the app's own version, the tag and the download names, which
      # the in-app updater (crates/craft-update) matches and checks.
      KALIMA_VERSION: 1.${{ github.run_number }}.0
      WORDCRAFT_VERSION: 1.${{ github.run_number }}.0
    steps:
      - uses: actions/checkout@v7
      - name: Interface translations (with Arabic)
        shell: bash
        run: |
          # Nasser's fork: the pinned upstream commit has no Arabic WordCraft catalog.
          git clone --depth 1 -b ar-wordcraft-missing-rows https://github.com/nasserfq/craft-i18n "$RUNNER_TEMP/craft-i18n"
          test -s "$RUNNER_TEMP/craft-i18n/locales/ar/wordcraft.tsv"
          echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2  # reuse compiled dependencies between releases
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev
      - name: macOS signing certificate
        if: runner.os == 'macOS'
        # Signed and notarized when these repository secrets exist; otherwise ad-hoc (unsigned).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          packaging/macos/import-cert.sh  # sets MACOS_SIGN_IDENTITY for the next step
      - name: macOS app (DMG), build
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DIST="$PWD/out" packaging/macos/package.sh --arch universal
          mv out/*.dmg "out/kalima-$KALIMA_VERSION-macos-universal.dmg"
          rm -f out/*.zip
      - name: Windows and Linux builds
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release --locked -p wordcraft
          mkdir -p out/Kalima
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md assets/fonts/OFL-*.txt out/Kalima/
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/wordcraft.exe out/Kalima/Kalima.exe
            (cd out && 7z a "kalima-$KALIMA_VERSION-windows-x64-portable.zip" Kalima >/dev/null)
          else
            cp target/release/wordcraft out/Kalima/kalima
            tar -C out -czf "out/kalima-$KALIMA_VERSION-linux-x86_64.tar.gz" Kalima
          fi
          rm -rf out/Kalima
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}.0
          name: كلمة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            كلمة: معالج نصوص عربي مبني على WordCraft من فريق ArtCraft.

            - macOS (Apple Silicon and Intel, macOS 11 or later): the `.dmg`. Signed and notarized by Apple.
            - Windows: the `windows-x64-portable.zip`, unzip and run `Kalima.exe`.
            - Linux: the `linux-x86_64.tar.gz`, extract and run `kalima`.

            كلمة يحدّث نفسه: عند توفر إصدار جديد تظهر رسالة «تحديث وإعادة تشغيل».
